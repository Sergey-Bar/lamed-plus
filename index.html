<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LAMED+ — לומדים נכון. עוברים בטוח. קורס תיאוריה חכם לישראל: שיעורים, תרגול מותאם, מבחני דמה בפורמט אמיתי ומעקב מוכנות — בעברית, אנגלית, רוסית וערבית."
    />
    <title>LAMED+ — לומדים נכון. עוברים בטוח.</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAMED+" />
    <meta property="og:title" content="LAMED+ — לומדים נכון. עוברים בטוח." />
    <meta
      property="og:description"
      content="הכנה למבחן התיאוריה: 1,841 שאלות רשמיות, שיעורים קצרים, מבחני דמה בפורמט אמיתי ומעקב מוכנות. עברית, English, Русский, العربية ועוד."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LAMED+ — לומדים נכון. עוברים בטוח." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <script>
      try {
        var t = localStorage.getItem('lamed-theme')
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div dir="rtl" style="max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.5rem">LAMED+ — קורס תיאוריה לישראל</h1>
        <p>
          שיעורים קצרים, תרגול מותאם ומבחני דמה בפורמט של 30 שאלות ב-40 דקות (26 תשובות נכונות
          למעבר), על בסיס מאגר השאלות הרשמי של משרד התחבורה. כל ההתקדמות נשמרת במכשיר עצמו — בלי
          חשבון ובלי שרת.
        </p>
        <p>
          האפליקציה דורשת JavaScript. אפשר לקרוא את <a href="/#/privacy">מדיניות הפרטיות</a>,
          <a href="/#/terms">התנאים</a> ואת <a href="/#/accessibility">הצהרת הנגישות</a> גם בלי
          להפעיל אותה.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
