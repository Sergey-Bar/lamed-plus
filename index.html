<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LAMED+ — לומדים נכון. עוברים בטוח. קורס תיאוריה חכם לישראל: שיעורים, תרגול מותאם, מבחני דמה בפורמט אמיתי ומעקב מוכנות — בעברית, אנגלית, רוסית וערבית."
    />
    <title>LAMED+ — לומדים נכון. עוברים בטוח.</title>
    <script>
      try {
        var t = localStorage.getItem('lamed-theme')
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
