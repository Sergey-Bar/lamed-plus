name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Vitest enforces the thresholds in vite.config.ts against src/lib/**,
      # so this step fails if coverage regresses. The previous shell check
      # compared a percentage that only counted files a test imported.
      - name: Test with coverage
        run: npm test -- --coverage

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e

  # Block PR merge on any failure
  # branch protection rules should require this job to pass